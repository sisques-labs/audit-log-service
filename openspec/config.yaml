schema: spec-driven

context: |
  Tech stack: NestJS 10, TypeScript (strict), GraphQL (Apollo code-first) + REST, CQRS (@nestjs/cqrs), TypeORM + PostgreSQL, kafkajs (inbound consumer), Jest, pnpm 10
  Architecture: DDD + CQRS + Hexagonal (Screaming Architecture). Bounded contexts: audit. Layers: domain / application / infrastructure / transport. Cross-cutting concerns live in core/ (config, filters, health, messaging).
  Purpose: append-only audit-log service. It consumes every domain event published to Kafka topics matching KAFKA_TOPIC_PREFIXES and persists an immutable audit record. There are NO user-facing mutations — only ingestion (CreateAuditLogCommand) and queries.
  Testing: Jest unit (co-located .spec.ts, jest.Mocked<T>). Coverage: pnpm test:cov
  Style: Prettier + ESLint, Husky + lint-staged. Conventional Commits. No AI attribution in commits.

testing:
  strict_tdd: true
  test_command: "pnpm test"
  coverage_command: "pnpm test:cov"
  e2e_command: "pnpm test:e2e"
  detected: "2026-06-25"
  layers:
    unit: { available: true, tool: "jest + ts-jest" }
    integration: { available: false, tool: "jest + postgres" }
    e2e: { available: false, tool: "jest + supertest" }
  coverage: { available: true, command: "pnpm test:cov" }
  quality:
    linter: { available: true, command: "pnpm lint" }
    type_checker: { available: true, command: "tsc --noEmit" }
    formatter: { available: true, command: "pnpm format" }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify all bounded contexts impacted
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect DDD+CQRS+Hexagonal layering — no cross-layer violations
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Each task must include a migration plan if the DB schema changes (TypeORM migrations under src/database/migrations)
  apply:
    - This is an append-only audit service. Do NOT add update/adjust/delete mutation commands or mutation resolvers/MCP tools for audit records. Ingestion happens via CreateAuditLogCommand (Kafka consumer); the public surface is queries only.
    - For every change that adds, removes, or modifies public API (commands, queries, events, endpoints) or domain concepts in a bounded context, update or create the README.md at src/contexts/{context}/README.md. The README must reflect the current state of the context — not just the delta.
    - Follow existing DDD+CQRS+Hexagonal patterns.
    - NestJS modules: group providers into named const arrays (COMMAND_HANDLERS, QUERY_HANDLERS, APPLICATION_SERVICES, DOMAIN_BUILDERS, INFRASTRUCTURE_REPOSITORIES, INFRASTRUCTURE_MAPPERS, INFRASTRUCTURE_ENTITIES, REST_PROVIDERS, GRAPHQL_PROVIDERS, MCP_TOOLS) and spread them in @Module. Always import CqrsModule. Use useClass (not useExisting) for repository DI tokens.
    - Constructor = hydration only; domain events from named instance methods only.
    - Logging: every transport entry point (controller method, resolver method) MUST log at entry with the relevant ID/input. Every command handler MUST log on completion. Every query handler MUST log at entry. Infrastructure services performing external I/O MUST log start and completion. Use NestJS Logger (private readonly logger = new Logger(ClassName.name)). Do NOT log inside assert services or domain methods.
    - Resolvers/controllers use CommandBus/QueryBus only — no direct service injection in transport.
    - MCP tools: the audit context exposes its public QUERIES as MCP tools under transport/mcp/. Each tool is a class named {Name}McpTool implementing IMcpTool (from @core/mcp), tagged with @McpTool() + @Injectable(), registered via an MCP_TOOLS const array. Tools dispatch through QueryBus only. Each tool's Zod inputSchema lives in its own file under transport/mcp/schemas/ ({name}.schema.ts). Wire-level tool names are snake_case prefixed by the entity (e.g. audit_log_find_by_id).
    - Repository interfaces live in domain (domain/repositories/read|write); never import infra from domain.
    - No module spec files; unit tests use jest.Mocked<T>, no @nestjs/testing.
    - Imports: always use @/ path aliases for any cross-directory import. Same-directory ./ imports are allowed.
    - Value objects named {Name}ValueObject; extend UuidValueObject/StringValueObject/EnumValueObject/DateValueObject from @sisques-labs/nestjs-kit.
    - Enums live in domain/enums/, enum value objects extend EnumValueObject<typeof EnumType>.
    - Commands have {Name}CommandInput interface with primitive fields; the Command class fields MUST be value objects constructed from the input in the constructor. Same rule applies to Queries.
    - Aggregate fields MUST always be value objects — never raw primitives. Builders receive primitives and wrap them in VOs; toPrimitives() unwraps with .value. Primitives and ViewModels hold primitives (the serialized form).
    - Aggregates constructed via Builder (BaseBuilder from nestjs-kit); NO static factory methods.
    - Assert services (assert-{entity}-view-model-exists) in application/services/read|write/; query handlers use them instead of raw findById + manual throw. Inject by class type only.
    - Repository interfaces extend IBaseReadRepository<ViewModel> or IBaseWriteRepository<Aggregate>.
    - Primitives type extends BasePrimitives; ViewModel extends BaseViewModel.
    - One type per file. Each interface/type alias lives in its OWN file named after it. The only exception is {Name}CommandInput/{Name}QueryInput, which stay inline in their {Name}.command.ts/{Name}.query.ts.
    - Domain exceptions extend BaseException (from nestjs-kit); map them to HTTP status via the context resolver wired into core/filters/base-exception.filter.ts.
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
