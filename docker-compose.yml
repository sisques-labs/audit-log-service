version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5435:5432'
    environment:
      POSTGRES_DB: audit_log_db
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit -d audit_log_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
